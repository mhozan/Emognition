name: Build executables

# Tests run on every push to master and on pull requests. Standalone PyInstaller
# bundles for Linux, Windows and macOS (Apple Silicon) are built for version tags
# (v*) and manual runs, and only after the tests pass. On a version tag the "release" job publishes the
# bundles (plus SHA256SUMS.txt) as a GitHub Release.
#
# PyInstaller does not cross-compile: each job runs on the target OS so that
# the bundled shared libraries match the host ABI.
#
# Supply-chain hygiene: every action is pinned to a full commit SHA (the
# version is in the trailing comment -- bump both together), the default token
# is read-only, and checkouts don't keep credentials around.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:   # manual trigger from the Actions tab

permissions:
  contents: read       # least privilege; only the release job asks for more

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warnings

jobs:
  # ── Tests (headless) ───────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries (Qt offscreen, audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libgl1 libegl1 libgles2 \
            libsndfile1 libportaudio2 libpulse0 libasound2-dev \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libxrandr2 libxi6 libxcursor1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install pytest==9.0.3

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen   # Qt window tests render off-screen
        run: python -m pytest -q

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libgl1 libegl1 libgles2 \
            libsndfile1 libportaudio2 libpulse0 libasound2-dev \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libdbus-1-3 libxrandr2 libxi6 libxcursor1 \
            libegl-dev libgbm-dev libdrm-dev \
            xvfb

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm emognition.spec

      - name: Smoke-test the bundle (virtual display)
        run: xvfb-run -a ./dist/emognition/emognition --selfcheck

      - name: Zip bundle
        run: |
          cd dist
          zip -r ../emognition-linux-x86_64.zip emognition/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: emognition-linux-x86_64
          path: emognition-linux-x86_64.zip

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────────
  # macos-15 is GitHub's standard arm64 runner. psychtoolbox 3.0.22.2 (macOS
  # only; see requirements.in) has a universal2 wheel that needs nothing from
  # Homebrew: PortAudio is linked in and libusb ships in the wheel. (The Intel
  # route -- a macos-13 runner and Rosetta 2 -- stalled in June 2026: that image
  # had been retired, so no runner ever picked the job up.) PyInstaller signs
  # the bundle ad hoc; it is not notarized.
  build-macos:
    name: Build (macOS arm64)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm emognition.spec

      - name: Smoke-test the bundle (headless)
        run: ./dist/emognition/emognition --selfcheck

      - name: Zip bundle
        # ditto keeps the symlinks inside Qt's frameworks; zip -r would copy them.
        run: ditto -c -k --keepParent dist/emognition emognition-macos-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: emognition-macos-arm64
          path: emognition-macos-arm64.zip

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm emognition.spec

      - name: Smoke-test the bundle (headless)
        run: .\dist\emognition\emognition.exe --selfcheck

      - name: Zip bundle
        run: Compress-Archive -Path dist\emognition -DestinationPath emognition-windows-x86_64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: emognition-windows-x86_64
          path: emognition-windows-x86_64.zip

  # ── GitHub Release (tags only) ─────────────────────────────────────────────
  # The release page is .github/release-notes.md (how to download and open the
  # app on each OS) followed by this version's section of CHANGELOG.md; a tag
  # without one fails here, before anything is published.
  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          changes=$(awk -v head="## ${version} " \
            'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md)
          if [ -z "$(echo "$changes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## ${version} ...' section"
            exit 1
          fi
          {
            sed "s/{{TAG}}/${GITHUB_REF_NAME}/g" .github/release-notes.md
            echo
            echo "## What's new in ${GITHUB_REF_NAME}"
            echo "$changes"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts/

      - name: Checksums
        run: |
          cd artifacts
          sha256sum */*.zip | sed 's#  [^ ]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: "Emognition ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'dev') }}
          files: |
            artifacts/emognition-windows-x86_64/emognition-windows-x86_64.zip
            artifacts/emognition-macos-arm64/emognition-macos-arm64.zip
            artifacts/emognition-linux-x86_64/emognition-linux-x86_64.zip
            artifacts/SHA256SUMS.txt

name: Build executables

# Tests run on every push to master and on pull requests. Standalone PyInstaller
# bundles for Linux and Windows are built for version tags (v*) and manual runs,
# and only after the tests pass. On a version tag the "release" job publishes the
# bundles (plus SHA256SUMS.txt) as a GitHub Release.
#
# PyInstaller does not cross-compile: each job runs on the target OS so that
# the bundled shared libraries match the host ABI.
#
# Supply-chain hygiene: every action is pinned to a full commit SHA (the
# version is in the trailing comment -- bump both together), the default token
# is read-only, and checkouts don't keep credentials around.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:   # manual trigger from the Actions tab

permissions:
  contents: read       # least privilege; only the release job asks for more

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warnings

jobs:
  # ── Tests (headless) ───────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries (Qt offscreen, audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libgl1 libegl1 libgles2 \
            libsndfile1 libportaudio2 libpulse0 libasound2-dev \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libxrandr2 libxi6 libxcursor1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install pytest==9.0.3

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen   # Qt window tests render off-screen
        run: python -m pytest -q

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libgl1 libegl1 libgles2 \
            libsndfile1 libportaudio2 libpulse0 libasound2-dev \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libdbus-1-3 libxrandr2 libxi6 libxcursor1 \
            libegl-dev libgbm-dev libdrm-dev \
            xvfb

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm emognition.spec

      - name: Smoke-test the bundle (virtual display)
        run: xvfb-run -a ./dist/emognition/emognition --selfcheck

      - name: Zip bundle
        run: |
          cd dist
          zip -r ../emognition-linux-x86_64.zip emognition/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: emognition-linux-x86_64
          path: emognition-linux-x86_64.zip

  # ── macOS — DISABLED ───────────────────────────────────────────────────────
  # GitHub retired the macos-13 image (Dec 2025); the Intel runner label is now
  # macos-15-intel (supported until the macOS 15 image retires, fall 2027).
  # The pinned psychtoolbox (3.0.19.14) has no arm64 wheel, so Apple Silicon runs
  # the Intel build under Rosetta 2. (psychtoolbox 3.0.22+ ships universal2
  # wheels, which would allow a native arm64 build -- not tried yet.) Re-enable
  # by uncommenting this job and adding build-macos to release.needs (untested
  # on macos-15-intel so far).
  #
  # build-macos:
  #   name: Build (macOS Intel x86_64)
  #   needs: [test]
  #   if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
  #   runs-on: macos-15-intel
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
  #       with: { persist-credentials: false }
  #     - run: brew install portaudio
  #     - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
  #       with: { python-version: "3.11" }
  #     - run: pip install --no-deps -r requirements.txt && pip install -r requirements-build.txt
  #     - run: python -m PyInstaller --noconfirm emognition.spec
  #     - run: ./dist/emognition/emognition --selfcheck
  #     - run: cd dist && zip -r ../emognition-macos-x86_64.zip emognition/
  #     - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
  #       with: { name: emognition-macos-x86_64, path: emognition-macos-x86_64.zip }

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --no-deps -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm emognition.spec

      - name: Smoke-test the bundle (headless)
        run: .\dist\emognition\emognition.exe --selfcheck

      - name: Zip bundle
        run: Compress-Archive -Path dist\emognition -DestinationPath emognition-windows-x86_64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: emognition-windows-x86_64
          path: emognition-windows-x86_64.zip

  # ── GitHub Release (tags only) ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts/

      - name: Checksums
        run: |
          cd artifacts
          sha256sum */*.zip | sed 's#  [^ ]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: "Emognition ${{ github.ref_name }}"
          body: |
            ## Emognition ${{ github.ref_name }}

            Pre-built standalone executables — **no Python or installation required**.

            | Platform | Download |
            |---|---|
            | **Windows** (10/11, 64-bit) | `emognition-windows-x86_64.zip` |
            | Linux x86_64 | `emognition-linux-x86_64.zip` |

            `SHA256SUMS.txt` lists the checksum of each download
            (`sha256sum -c SHA256SUMS.txt` on Linux, `Get-FileHash` on Windows).

            ### Windows — step-by-step

            1. Click **`emognition-windows-x86_64.zip`** above to download it.
            2. Right-click the downloaded file → **Extract All…** → choose a location (e.g. your Desktop) → click **Extract**.
            3. Open the extracted **`emognition`** folder.
            4. Double-click **`emognition.exe`** to launch.

            > **First launch:** Windows may show a SmartScreen warning ("Windows protected your PC").
            > Click **More info** → **Run anyway** — this is expected for software not yet submitted to Microsoft's signing program.
            > A small black terminal window may appear alongside the main window; this is normal and can be minimised.

            ### Linux

            ```bash
            unzip emognition-linux-x86_64.zip
            ./emognition/emognition
            ```
            (`chmod +x emognition/emognition` if needed.)

            See the [README](https://github.com/mhozan/Emognition/blob/master/README.md) for full usage, stimulus folder setup, and report descriptions.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'dev') }}
          files: |
            artifacts/emognition-linux-x86_64/emognition-linux-x86_64.zip
            artifacts/emognition-windows-x86_64/emognition-windows-x86_64.zip
            artifacts/SHA256SUMS.txt
